<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="https://unpkg.com/normalize.css/normalize.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3.4.0"></script>
</head>

<body>
  <div id="app">
    <div class="top-panel">
      <form @submit.prevent="addTask">
        <input class="new-task-input" v-model="newDescription" ref="newTaskInput" placeholder="Add new task">
        <select class="priority-select" v-model="newPriority">
          <option disabled value="">Select priority</option>
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
        <button type="submit" class="add-button">+ Add Task</button>
      </form>
      <input class="filter-input" v-model="filtered" placeholder="Filter tasks...">
    </div>

    <div class="tasks-panel">
      <div class="tasks-header">
        <h3>Your Tasks</h3>
        <span class="task-count">{{ filteredTasks.length }} task(s)</span>
      </div>

      <div v-if="filteredTasks.length === 0" class="empty-state">
        <p>
          No tasks found.<br>
          Try changing the filter or add some tasks!
        </p>
      </div>

      <div v-else>
        <div
          v-for="task in filteredTasks"
          :key="task.id"
          :class="{ task: true, completed: task.done, [task.priority?.toLowerCase()]: true }"
        >
          <div class="task-content">
            <input v-model="task.done" type="checkbox">
            <span class="task-description">{{ task.description }}</span>
          </div>
          <button type="button" class="remove-button" @click="removeTask(task.id)" title="Remove task">✖</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, onMounted, ref, watch, computed } = Vue;

    const App = {
      setup() {
        const tasks = ref(JSON.parse(localStorage.getItem('tasks') ?? '[]'));
        const newTaskInput = ref(null);
        const newDescription = ref('');
        const newPriority = ref('');
        const filtered = ref('');

        onMounted(() => {
          newTaskInput.value.focus();
        });

        watch(
          tasks,
          () => {
            localStorage.setItem('tasks', JSON.stringify(tasks.value));
          },
          { deep: true }
        );

        const filteredTasks = computed(() => {
          if (filtered.value === '') {
            return tasks.value;
          }

          return tasks.value.filter(task =>
            task.description.toLowerCase().includes(filtered.value.toLowerCase())
          );
        });

        const addTask = () => {
          if (newDescription.value === '' || newPriority.value === '') {
            return;
          }

          tasks.value.push({
            id: Date.now(),
            description: newDescription.value,
            priority: newPriority.value,
            done: false
          });

          newDescription.value = '';
          newPriority.value = '';
          newTaskInput.value.focus();
        };

        function removeTask(id) {
          tasks.value = tasks.value.filter(task => task.id !== id);
        }

        return {
          newTaskInput,
          tasks,
          newDescription,
          newPriority,
          addTask,
          removeTask,
          filtered,
          filteredTasks
        };
      }
    };

    createApp(App).mount('#app');
  </script>
</body>
</html>
